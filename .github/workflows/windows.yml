name: Windows checks
on:
  push:
    paths: ['windows/**', 'backend/**', '.github/workflows/windows.yml']
  pull_request:
    paths: ['windows/**', 'backend/**', '.github/workflows/windows.yml']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Shared protocol and Windows adapter tests
        working-directory: backend
        run: |
          python -m pip install 'numpy>=2.3,<3'
          python -m unittest test_server test_prompt_store test_streaming test_cleanup_cache test_cleanup_contract test_windows_setup test_windows_models test_windows_server -q
      - name: Build self-contained Windows client
        run: dotnet publish windows/app/LocalDictation.csproj -c Release -r win-x64 --self-contained true -o build/windows-client
      - name: Storage and client self-test without microphone or clipboard
        shell: pwsh
        run: |
          $report = Join-Path $PWD 'build/windows-self-test.json'
          $p = Start-Process (Join-Path $PWD 'build/windows-client/LocalDictation.exe') -ArgumentList '--self-test','--result-file',$report -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Native self-test failed' }
          $result = Get-Content $report -Raw | ConvertFrom-Json
          if (!$result.success) { throw 'Native self-test report failed' }
          Get-Content $report
      - name: Compile interactive acceptance fixture
        run: dotnet build windows/tests/DesktopProbe.csproj -c Release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-check-results
          path: build/windows-self-test.json
