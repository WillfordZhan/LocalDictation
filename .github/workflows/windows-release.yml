name: Publish validated Windows preview draft
on:
  workflow_dispatch:
    inputs:
      package_run:
        description: 'Successful Windows preview package run ID'
        required: true
        type: string
permissions:
  contents: write
  actions: read
jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - name: Verify source run and fetch its exact artifact
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PACKAGE_RUN: ${{ inputs.package_run }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PACKAGE_RUN" =~ ^[0-9]+$ ]]
          gh api "repos/$GH_REPO/actions/runs/$PACKAGE_RUN" > run.json
          jq -e '.conclusion == "success" and .path == ".github/workflows/windows-package.yml" and .head_repository.full_name == "WillfordZhan/LocalDictation"' run.json
          gh run download "$PACKAGE_RUN" --name LocalDictation-Windows-x64-preview --dir package
          gh run download "$PACKAGE_RUN" --name windows-preview-evidence --dir evidence
          test -f evidence/inference-result.json
          jq -e '.success == true and .microphone_used == false' evidence/inference-result.json
          jq -e '.success == true' evidence/desktop-results/desktop-result.json
          jq -e '.success == true' evidence/ui-results/ui-smoke.json
          source_commit=$(jq -r .head_sha run.json)
          gh api "repos/$GH_REPO/actions/runs?head_sha=$source_commit&per_page=100" > checks.json
          jq -e '[.workflow_runs[] | select(.name == "Source checks" and .conclusion == "success")] | length > 0' checks.json
          jq -e '[.workflow_runs[] | select(.name == "Windows checks" and .conclusion == "success")] | length > 0' checks.json
          cd package
          sha256sum -c LocalDictation-*.zip.sha256
      - name: Create source-pinned draft with verification evidence
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PACKAGE_RUN: ${{ inputs.package_run }}
        shell: bash
        run: |
          set -euo pipefail
          source_commit=$(jq -r .head_sha run.json)
          python3 - <<'PY'
          import json, pathlib, zipfile
          source = json.loads(pathlib.Path('run.json').read_text())['head_sha']
          package = next(pathlib.Path('package').glob('*.zip'))
          with zipfile.ZipFile(package) as archive:
              inputs = json.loads(archive.read('LocalDictation/build-inputs.json'))
          assert inputs['source_commit'] == source and not inputs['source_tree_dirty'], inputs
          notes = '''Windows x64 首个预览版。无需 NVIDIA 显卡，内置 Python 与 .NET；首次在“模型与配置”下载约 4.1 GB 模型。

          包含全局快捷键、托盘后台、录音浮窗、多段顺序填入、ASR/最终正文历史、个人词典和 Prompt 版本管理。数据保存在应用外，更新请只替换程序目录。

          本包经过 GitHub 托管 Windows 的编译、自检、完整 ZIP 重定位启动与真实 CPU 模型验证。验收详情见附带 evidence；真实麦克风、第三方聊天框兼容性以及 Windows 10 实机尚待验收。自动纠错学习、热力图和 GPU 加速尚未移植。

          完整解压 ZIP 后启动 LocalDictation.exe。未购买 Windows 代码签名证书，可能显示未知发布者；缺少 VC++ 运行库时，应用提供微软原始签名安装程序的显式安装入口。
          '''
          measured = json.loads(pathlib.Path('evidence/inference-result.json').read_text())
          audio = measured['audio_result']
          warm = measured['cleanup_result']
          notes += (f"\n托管 CPU 实测（合成录音，仅代表该机器）：{audio['audio_seconds']:.1f} 秒音频，"
                    f"ASR {audio['asr_seconds']:.1f} 秒，首次整理 {audio['cleanup_seconds']:.1f} 秒；"
                    f"随后另一条短文本整理 {warm['cleanup_seconds']:.1f} 秒。首次响应仍较慢。\n")
          pathlib.Path('RELEASE.md').write_text(notes + '\n源代码：`' + source + '`\n', encoding='utf-8')
          with zipfile.ZipFile('Windows-validation-evidence.zip','w',zipfile.ZIP_DEFLATED) as output:
              for path in pathlib.Path('evidence').rglob('*'):
                  if path.is_file(): output.write(path,path.relative_to('evidence'))
          PY
          # The maintainer creates the tag and draft with their existing GitHub
          # identity; the workflow token only uploads verified assets to it.
          gh api "repos/$GH_REPO/git/ref/tags/v0.6.0-windows-preview.1" > tag.json
          jq -e --arg sha "$source_commit" '.object.type == "commit" and .object.sha == $sha' tag.json
          gh api "repos/$GH_REPO/releases/tags/v0.6.0-windows-preview.1" > draft.json
          jq -e '.draft == true and .prerelease == true' draft.json
          gh release upload v0.6.0-windows-preview.1 package/* Windows-validation-evidence.zip
          gh release edit v0.6.0-windows-preview.1 --notes-file RELEASE.md
