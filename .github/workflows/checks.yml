name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    # The complete suite exercises the real macOS installer and atomic model
    # directory exchange; keep these checks on the platform the app supports.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=1.26,<3' 'tqdm>=4.66,<5'
      - name: Protocol and scheduling tests without model downloads
        working-directory: backend
        run: python -m unittest discover -p 'test_*.py' -q
      - name: Distribution validation
        run: python -m unittest discover -s packaging -p 'test_*.py' -q
  native:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: AppKit and storage tests without microphone or model access
        run: bash macos/test.sh
