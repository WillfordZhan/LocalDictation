name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=1.26,<3'
      - name: Protocol and scheduling tests without model downloads
        working-directory: backend
        run: python -m unittest discover -p 'test_*.py' -q
  native:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: AppKit and storage tests without microphone or model access
        run: bash macos/test.sh
